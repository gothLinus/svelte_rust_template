[package]
name = "application"
description = "Use cases, authorization policies and DTOs. Depends only on domain; generic over its ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "export-types"
path = "src/bin/export-types.rs"

[dependencies]
base64.workspace = true
domain.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
bytes.workspace = true
futures-util.workspace = true
# The catalog the tests take their expected texts from. `i18n` itself depends only on
# `domain`, so the application still knows nothing of it outside tests.
i18n.workspace = true
time = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
uuid = { workspace = true, features = ["v7"] }
zeroize.workspace = true

[lints]
workspace = true
