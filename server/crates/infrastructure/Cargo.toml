[package]
name = "infrastructure"
description = "Adapters for the domain ports: PostgreSQL (sqlx), Argon2id, OS randomness, SMTP (lettre) and configuration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Deterministic adapters for tests in other crates: a manual clock and a recording mailer.
test-support = []

[dependencies]
argon2.workspace = true
base64.workspace = true
domain.workspace = true
dotenvy.workspace = true
getrandom.workspace = true
lettre = { workspace = true, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots", "tracing"] }
reqwest = { workspace = true, features = ["json", "form", "rustls-no-provider"] }
ring.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "migrate", "uuid", "time", "ipnet"] }
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true

[dev-dependencies]
infrastructure = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
time = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[lints]
workspace = true
