// `/api/v1/auth/{email-code,magic-link,phone-code}`: signing in without a password.

syntax = "proto3";

package api.v1;

import "api/v1/options.proto";

enum TextChannel {
  TEXT_CHANNEL_UNSPECIFIED = 0;
  TEXT_CHANNEL_SMS = 1;
  TEXT_CHANNEL_WHATSAPP = 2;
}

message EmailCodeRequest {
  string email = 1;
}

message VerifyEmailCodeRequest {
  string email = 1;
  string code = 2 [(api.v1.secret) = true];
}

message MagicLinkRequest {
  string token = 1 [(api.v1.secret) = true];
}

message PhoneCodeRequest {
  string phone = 1;
  TextChannel channel = 2;
}

message VerifyPhoneCodeRequest {
  string phone = 1;
  string code = 2 [(api.v1.secret) = true];
}
